name: CI

on:
  push:
    # `feat/**` carries the 4.0 line. It had ~40 commits and no CI run before
    # this, so every "tests pass" claim on it came from one local machine.
    branches: [main, 'codex/**', 'feat/**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run prepublishOnly

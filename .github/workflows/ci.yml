name: CI

on:
  push:
    # `feat/**` carries the 4.0 line. It had ~40 commits and no CI run before
    # this, so every "tests pass" claim on it came from one local machine.
    branches: [main, 'codex/**', 'feat/**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.12.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run prepublishOnly
      # `shell/` is a private package that lives inside this repo and is deliberately outside the
      # npm tarball (`files` in package.json), so `prepublishOnly` — typecheck, build, test, pack —
      # never sees it. Its suite is a second gate with its own lockfile and its own preload.
      - run: cd shell && bun install --frozen-lockfile
      - run: cd shell && bun test test

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cogmem 记忆观测台</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<style>
  /* Operate surface, picked from the use scene: a person looking at a corpus the way one looks at a
     sky — dark, because the subject is a star field, and the light comes from the data, not the page. */
  :root {
    --void: #05070d;
    --surface: #0a0f16;
    --panel: #10161f;
    --panel-2: #141c27;
    --line: #1f2937;
    --line-soft: #172030;
    --ink: #e9eff8;
    --ink-dim: #a8b6ca;
    --ink-faint: #78889e;
    --accent: #f2c14e;
    --accent-ink: #1a1508;
    --live: #56b57e;
    --demo: #e0a33e;
    --danger: #e2726a;
    --focus: #7fb2ff;
    --radius: 6px;
    --step-1: 0.75rem;
    --step-2: 0.8125rem;
    --step-3: 0.875rem;
    --step-4: 1rem;
    --step-5: 1.25rem;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--void);
    color: var(--ink);
    font: 400 var(--step-3)/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
    display: grid;
    grid-template-rows: auto 1fr;
    height: 100vh;
    overflow: hidden;
  }
  ::selection { background: #2b3c58; color: #fff; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
  * { scrollbar-color: #2b3646 transparent; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2b3646; border: 3px solid transparent; background-clip: content-box; border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: #3b4a5f; background-clip: content-box; }
  td, th, .num { font-variant-numeric: tabular-nums; }

  /* ---- header ---------------------------------------------------------- */
  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem 1.25rem;
    padding: 0.625rem 1rem;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  h1.brand { display: flex; align-items: center; gap: 0.5rem; margin: 0; font-weight: 600; font-size: var(--step-4); letter-spacing: -0.01em; }
  .brand .mark { width: 15px; height: 15px; }
  .brand small { font-weight: 400; font-size: var(--step-2); color: var(--ink-faint); letter-spacing: 0; }
  .header-group { display: flex; align-items: center; gap: 0.5rem; min-width: 0; flex-wrap: wrap; }
  label.field { display: flex; align-items: center; gap: 0.375rem; font-size: var(--step-2); color: var(--ink-faint); }
  select {
    appearance: none; background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: 0.3125rem 0.5rem; font: inherit; font-size: var(--step-2); max-width: 16rem;
  }
  select:focus-visible { border-color: var(--focus); }
  .badge {
    display: inline-flex; align-items: center; gap: 0.375rem;
    font-size: var(--step-1); letter-spacing: 0.02em; text-transform: uppercase;
    padding: 0.1875rem 0.4375rem; border-radius: 999px; border: 1px solid transparent;
  }
  .badge-live { color: #bfe6cd; background: #14301f; border-color: #23533a; }
  .badge-demo { color: #f6dfb4; background: #37280c; border-color: #6a4d15; }
  .badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .meta { font-family: var(--mono); font-size: var(--step-1); color: var(--ink-faint); min-width: 0; overflow-wrap: anywhere; }
  .meta b { color: var(--ink-dim); font-weight: 500; }
  .spacer { flex: 1 1 auto; }

  /* agent roster + tabs share one row under the header */
  .scope-bar {
    display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
    padding: 0.5rem 1rem; background: var(--surface); border-bottom: 1px solid var(--line);
    max-height: 6.5rem; overflow-y: auto;
  }
  .scope-bar .roster-label { font-size: var(--step-1); text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-faint); }
  .chip {
    font: inherit; font-size: var(--step-2); color: var(--ink-dim);
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
    padding: 0.1875rem 0.625rem; cursor: pointer; display: inline-flex; align-items: center; gap: 0.375rem;
    transition: background 160ms ease-out, color 160ms ease-out, border-color 160ms ease-out;
  }
  .chip:hover { background: var(--panel-2); color: var(--ink); }
  .chip[aria-pressed="true"] { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
  .chip .count { font-family: var(--mono); font-size: var(--step-1); opacity: 0.72; }
  .chip.host::after { content: "host"; font-size: 0.625rem; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.7; }

  /* ---- layout ---------------------------------------------------------- */
  main { display: grid; grid-template-columns: minmax(0, 1fr) 23rem; min-height: 0; }
  .stage { position: relative; min-width: 0; min-height: 0; background: radial-gradient(120% 90% at 60% 40%, #0b1220 0%, var(--void) 70%); }
  .panel { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; min-height: 0; }
  @media (max-width: 900px) {
    main { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(18rem, 1fr) minmax(12rem, 45vh); }
    .panel { border-left: none; border-top: 1px solid var(--line); }
  }

  nav.tabs { display: flex; gap: 0.25rem; background: var(--surface); border-bottom: 1px solid var(--line); padding: 0 0.75rem; }
  nav.tabs button {
    appearance: none; background: none; border: none; border-bottom: 2px solid transparent;
    color: var(--ink-faint); font: inherit; font-size: var(--step-3); font-weight: 500;
    padding: 0.625rem 0.75rem; cursor: pointer; transition: color 160ms ease-out, border-color 160ms ease-out;
  }
  nav.tabs button:hover { color: var(--ink-dim); }
  nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

  /* ---- star map -------------------------------------------------------- */
  #map { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #map:active { cursor: grabbing; }
  .map-overlay { position: absolute; left: 0.875rem; bottom: 0.875rem; display: flex; flex-direction: column; gap: 0.5rem; pointer-events: none; }
  .map-overlay > * { pointer-events: auto; }
  .legend { background: rgba(9, 13, 20, 0.86); border: 1px solid var(--line-soft); border-radius: var(--radius); padding: 0.5rem 0.625rem; max-width: 22rem; }
  .legend h2 { margin: 0 0 0.375rem; font-size: var(--step-1); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-faint); }
  .legend ul { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 0.25rem 0.75rem; }
  .legend li { display: inline-flex; align-items: center; gap: 0.3125rem; font-size: var(--step-1); color: var(--ink-dim); }
  .swatch { width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 6px currentColor; background: currentColor; }
  .lod-row { display: flex; gap: 0.25rem; align-items: center; flex-wrap: wrap; }
  .lod-row button {
    font: inherit; font-size: var(--step-1); font-family: var(--mono);
    color: var(--ink-dim); background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 0.125rem 0.4375rem; cursor: pointer;
  }
  .lod-row button[aria-pressed="true"] { color: var(--ink); border-color: #3a4a60; background: var(--panel-2); }
  .lod-row button[aria-pressed="false"] { opacity: 0.5; text-decoration: line-through; }
  .notice {
    background: rgba(9, 13, 20, 0.9); border: 1px solid #5a4416; border-radius: var(--radius);
    padding: 0.4375rem 0.625rem; font-size: var(--step-1); color: #f0d9a8; max-width: 24rem;
  }
  .notice.hidden { display: none; }
  .hint { font-size: var(--step-1); color: var(--ink-faint); }
  .hovercard {
    position: absolute; pointer-events: none; z-index: 5; max-width: 22rem;
    background: rgba(13, 18, 26, 0.95); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 0.375rem 0.5rem; font-size: var(--step-2); box-shadow: 0 6px 18px rgba(0,0,0,0.5);
    opacity: 0; transition: opacity 120ms ease-out;
  }
  .hovercard.on { opacity: 1; }
  .hovercard .t { color: var(--ink); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hovercard .s { color: var(--ink-faint); font-family: var(--mono); font-size: var(--step-1); }

  /* ---- panel internals ------------------------------------------------- */
  .section { padding: 0.875rem 1rem; border-bottom: 1px solid var(--line-soft); }
  .section:last-child { border-bottom: none; }
  h2.head { margin: 0 0 0.5rem; font-size: var(--step-2); font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-faint); }
  h3 { margin: 0 0 0.25rem; font-size: var(--step-4); font-weight: 600; line-height: 1.35; }
  p { margin: 0 0 0.5rem; }
  p.dim, .dim { color: var(--ink-dim); }
  .prose { max-width: 68ch; }
  dl.kv { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 0.1875rem 0.75rem; font-size: var(--step-2); }
  dl.kv dt { color: var(--ink-faint); }
  dl.kv dd { margin: 0; color: var(--ink-dim); word-break: break-word; font-variant-numeric: tabular-nums; }
  code, .cmd { font-family: var(--mono); font-size: var(--step-1); }
  .cmd {
    display: block; position: relative; background: #0a1017; border: 1px solid var(--line-soft);
    border-radius: var(--radius); padding: 0.5rem 3.25rem 0.5rem 0.5rem; margin: 0.25rem 0 0.625rem;
    color: #cfe0f5; white-space: pre-wrap; word-break: break-all;
  }
  .cmd button {
    position: absolute; top: 0.3rem; right: 0.3rem; font: inherit; font-family: var(--sans); font-size: var(--step-1);
    color: var(--ink-dim); background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px;
    padding: 0.0625rem 0.375rem; cursor: pointer;
  }
  .cmd button:hover { color: var(--ink); }
  ul.evidence { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 0.25rem; }
  ul.evidence li { font-size: var(--step-2); }
  ul.evidence button { font: inherit; font-size: var(--step-2); color: var(--ink-dim); background: none; border: none; padding: 0; cursor: pointer; text-align: left; }
  ul.evidence button:hover { color: var(--accent); }
  ul.edges { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 0.1875rem; }
  ul.edges li { font-size: var(--step-2); display: flex; gap: 0.375rem; align-items: baseline; }
  ul.edges .rel { font-family: var(--mono); font-size: var(--step-1); color: var(--ink-faint); flex: none; }
  ul.edges button { font: inherit; font-size: var(--step-2); color: var(--ink-dim); background: none; border: none; padding: 0; cursor: pointer; text-align: left; }
  ul.edges button:hover { color: var(--accent); }
  .empty { padding: 1.25rem 1rem; color: var(--ink-dim); font-size: var(--step-3); }
  .empty h3 { font-size: var(--step-4); }
  .skeleton { height: 0.75rem; border-radius: 4px; background: linear-gradient(90deg, #16202c 25%, #1d2a39 50%, #16202c 75%); background-size: 200% 100%; animation: shim 1.4s linear infinite; margin-bottom: 0.5rem; }
  .skeleton.w60 { width: 60%; } .skeleton.w40 { width: 40%; } .skeleton.w80 { width: 80%; }
  @keyframes shim { to { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } }

  /* ---- timeline -------------------------------------------------------- */
  .view { display: none; height: 100%; overflow: auto; }
  .view.on { display: block; }
  .stage .view.on { display: block; }
  .chart-wrap { padding: 1rem; }
  svg.chart { width: 100%; height: auto; display: block; touch-action: pan-y; }
  .bar { transition: opacity 140ms ease-out; }
  .bar:hover { opacity: 0.75; }
  .axis { fill: var(--ink-faint); font-size: 11px; font-family: var(--mono); }
  .grid-line { stroke: var(--line-soft); stroke-width: 1; }
  .brush { fill: rgba(127, 178, 255, 0.14); stroke: var(--focus); stroke-width: 1; }
  .brush-handle { fill: var(--focus); }
  .tl-legend { display: flex; gap: 1rem; flex-wrap: wrap; padding: 0 1rem 0.5rem; font-size: var(--step-2); color: var(--ink-dim); }
  .tl-legend span { display: inline-flex; align-items: center; gap: 0.375rem; }
  .day-panel { padding: 0.5rem 1rem 1.25rem; display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); }
  .day-panel h3 { font-size: var(--step-3); }
  ul.plain { margin: 0; padding: 0; list-style: none; font-size: var(--step-2); color: var(--ink-dim); display: flex; flex-direction: column; gap: 0.1875rem; }
  ul.plain li { display: flex; justify-content: space-between; gap: 1rem; border-bottom: 1px dotted var(--line-soft); padding-bottom: 0.125rem; }
  ul.plain button { font: inherit; color: var(--ink-dim); background: none; border: none; padding: 0; cursor: pointer; text-align: left; }
  ul.plain button:hover { color: var(--accent); }

  /* ---- recalls --------------------------------------------------------- */
  .split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); height: 100%; min-height: 0; }
  @media (max-width: 900px) { .split { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; } }
  .list { overflow-y: auto; border-right: 1px solid var(--line-soft); min-height: 0; }
  .recall-item {
    display: block; width: 100%; text-align: left; font: inherit; color: var(--ink-dim);
    background: none; border: none; border-bottom: 1px solid var(--line-soft); padding: 0.6875rem 1rem; cursor: pointer;
    transition: background 140ms ease-out;
  }
  .recall-item:hover { background: var(--panel-2); }
  .recall-item[aria-current="true"] { background: var(--panel-2); box-shadow: inset 2px 0 0 var(--accent); }
  .recall-item .q { color: var(--ink); font-size: var(--step-3); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .recall-item .m { font-family: var(--mono); font-size: var(--step-1); color: var(--ink-faint); }
  .trace { overflow-y: auto; padding: 0.875rem 1rem; min-height: 0; }
  pre.json { margin: 0; font-family: var(--mono); font-size: var(--step-1); line-height: 1.55; color: #cfe0f5; white-space: pre-wrap; word-break: break-word; }
  .suppressed { display: flex; flex-wrap: wrap; gap: 0.375rem; margin: 0 0 0.625rem; }
  .suppressed span { font-size: var(--step-1); font-family: var(--mono); color: #f0c9a8; background: #2c1e12; border: 1px solid #56391f; border-radius: 999px; padding: 0.0625rem 0.4375rem; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
</style>
</head>
<body>
<header>
  <h1 class="brand">
    <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="#f2c14e" stroke-width="1.6"><circle cx="12" cy="12" r="2.6" fill="#f2c14e" stroke="none"/><ellipse cx="12" cy="12" rx="10" ry="4.2" transform="rotate(-24 12 12)"/><ellipse cx="12" cy="12" rx="10" ry="4.2" transform="rotate(38 12 12)" opacity="0.6"/></g></svg>
    Cogmem 记忆观测台 <small>只读</small>
  </h1>
  <div class="header-group">
    <label class="field">项目 <select id="project-select"></select></label>
  </div>
  <div class="spacer"></div>
  <div class="header-group">
    <span id="source-badge" class="badge badge-live"><span class="dot"></span><span id="source-label">live</span></span>
    <span class="meta" id="waterline"></span>
  </div>
</header>

<div class="scope-bar" id="scope-bar" role="group" aria-label="智能体范围">
  <span class="roster-label">范围</span>
  <button class="chip" id="scope-all" aria-pressed="true">全部<span class="count" id="scope-all-count"></span></button>
  <span id="roster"></span>
</div>

<nav class="tabs" role="tablist" aria-label="观测台页面">
  <button role="tab" id="tab-starmap" aria-controls="view-starmap" aria-selected="true">星图</button>
  <button role="tab" id="tab-timeline" aria-controls="view-timeline" aria-selected="false">时间线</button>
  <button role="tab" id="tab-recalls" aria-controls="view-recalls" aria-selected="false">召回检查</button>
</nav>

<main>
  <section class="stage" aria-label="星图">
    <div class="view on" id="view-starmap" role="tabpanel" aria-labelledby="tab-starmap" style="height:100%">
      <canvas id="map" tabindex="0" role="application"
        aria-label="三维记忆星图。方向键旋转，加号与减号缩放，回车选中屏幕中央最近的节点，Esc 取消选择。"></canvas>
      <div class="hovercard" id="hovercard" role="presentation"></div>
      <div class="map-overlay">
        <div class="notice hidden" id="truncation-notice"></div>
        <div class="legend" id="legend">
          <h2>图例 · <span id="legend-scope">全部</span></h2>
          <ul id="legend-items"></ul>
          <div class="lod-row" style="margin-top:0.4375rem">
            <span class="hint">LOD</span>
            <button type="button" data-lod="0" aria-pressed="true">L0 骨架</button>
            <button type="button" data-lod="1" aria-pressed="true">L1 主体</button>
            <button type="button" data-lod="2" aria-pressed="true">L2 细粒度</button>
          </div>
          <p class="hint" id="map-stats" style="margin:0.4375rem 0 0"></p>
          <p class="hint" style="margin:0.25rem 0 0">拖动旋转 · 滚轮/捏合缩放 · 悬停查看 · 点选详情</p>
        </div>
      </div>
    </div>
    <div class="view" id="view-timeline" role="tabpanel" aria-labelledby="tab-timeline"></div>
    <div class="view" id="view-recalls" role="tabpanel" aria-labelledby="tab-recalls"></div>
  </section>
  <aside class="panel" id="panel" aria-live="polite"></aside>
</main>

<script type="module" src="./app.js"></script>
</body>
</html>
